version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: csr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: csr_intel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csr-app
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/csr_intel
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
    driver: local
